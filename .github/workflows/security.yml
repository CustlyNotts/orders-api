# The workflow from the talk, in full.
# Every action is pinned to a full commit SHA (the tag is in the comment),
# because tags can be moved. Renovate keeps the SHAs up to date.
name: security

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the GITHUB_TOKEN: jobs ask for more only if they need it.
permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan the source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so Gitleaks can scan every commit
          persist-credentials: false

      - name: Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free, but required for repos owned by an organization (gitleaks.io).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Code (Semgrep)
        run: pipx run --spec semgrep==1.178.0 semgrep scan --config p/default --error

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Tests
        run: npm ci && npm test

      - name: Dependencies, secrets and config (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          trivy-config: trivy.yaml # scanners, severity and skip-dirs live there
          exit-code: "1"

  image:
    name: Build, scan and sign the image
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
      id-token: write # keyless signing with cosign
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name
        # Registry names must be lowercase; GitHub owner names may not be.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orders-api:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build
        run: docker build -t "$IMAGE" .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true # don't block on CVEs nobody can fix yet
          exit-code: "1"

      - name: SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          artifact-name: orders-api.spdx.json

      # Pull requests stop here: scanned, but only main gets pushed and signed.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push'

      - name: Push and sign by digest
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE"
          DIGEST=$(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE")
          cosign sign --yes "$DIGEST"
          echo "Pushed and signed \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
