# Runs on every `git commit` once you've run `pre-commit install`.
# Keep hooks fast: heavy scans belong in CI (.github/workflows/security.yml).
# `pre-commit autoupdate` bumps these tags; Renovate does it too.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks # blocks API keys, tokens and passwords

  - repo: https://github.com/semgrep/pre-commit
    rev: v1.178.0
    hooks:
      - id: semgrep # fast SAST on the staged files
        args: ["--config", "p/default", "--error", "--skip-unknown-extensions"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
        exclude: ^insecure-examples/
      - id: check-added-large-files
      - id: check-yaml
        args: ["--allow-multiple-documents"]
